<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dozzz</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1 class="game-title">Dozzz</h1>
      <p class="wave-counter" id="wave-counter">Wave: 1</p>
      <canvas
        class="game-canvas"
        id="canvas"
        width="500px"
        height="500px"
        style="border: 1px solid black"
      >
        Dozzz game
        <canvas
          id="canvas-debug"
          width="500px"
          height="500px"
          style="border: 1px solid black"
        >
          Dozzz game
        </canvas>
      </canvas>
    </div>
    <button class="start-game-button" id="start-game-button">Start</button>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
